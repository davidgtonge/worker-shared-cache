name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native }
      - run: npm ci
      - run: npm run lint

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: npm ci
      - run: npm run build
      - run: npm run coverage

  # Every target builds and runs the full test suite on its own architecture, so each published binary
  # has been loaded and tested where it will run. Linux builds run in containers: Debian bullseye keeps the
  # glibc requirement at 2.31 (a build on the runner's Ubuntu would need 2.39), and Alpine gives real musl.
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, image: 'node:22-bullseye' }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, image: 'node:22-bullseye' }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, image: 'node:22-alpine' }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, image: 'node:22-alpine' }
    steps:
      - uses: actions/checkout@v4

      - if: ${{ !matrix.image }}
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: ${{ !matrix.image }}
        uses: dtolnay/rust-toolchain@stable
      - if: ${{ !matrix.image }}
        uses: Swatinem/rust-cache@v2
        with: { workspaces: native, key: '${{ matrix.target }}' }
      - if: ${{ !matrix.image }}
        name: Build and test
        shell: bash
        run: |
          npm ci
          npm run build
          npm test

      - if: ${{ matrix.image }}
        name: Build and test in ${{ matrix.image }}
        # musl targets default to a static C runtime, which can't produce the shared library Node loads.
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e RUSTFLAGS='${{ contains(matrix.target, 'musl') && '-C target-feature=-crt-static' || '' }}' \
            ${{ matrix.image }} sh -euc '
              if command -v apk >/dev/null; then apk add --no-cache build-base curl; fi
              # napi assumes a musl arm64 target is cross-compiled and asks for a cross linker by that name;
              # building natively, the container's own gcc is the right one.
              if [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ]; then
                ln -s "$(command -v gcc)" /usr/local/bin/aarch64-linux-musl-gcc
              fi
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              npm ci
              npm run build
              npm test
            '
      - if: ${{ contains(matrix.target, 'linux-gnu') }}
        name: Report the newest glibc symbol the binary needs
        run: objdump -T lib/*.node | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: lib/*.node
          if-no-files-found: error

  node-versions:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native }
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Runs only for a pushed tag like v0.2.0, after everything above passes. Needs an NPM_TOKEN secret with
  # publish rights. Each platform package is published first, then the main package that depends on them.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, coverage, build, node-versions]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      # lib/binding.js is committed, so compiling src/index.ts needs no Rust build here.
      - run: npm run build:ts
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but package.json is $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { pattern: 'bindings-*', path: artifacts }
      - name: Move each binary into its platform package
        run: npx napi artifacts --output-dir artifacts --npm-dir npm
      - name: Check every platform package has its binary
        run: for dir in npm/*/; do ls "$dir"*.node; done
      - name: Publish the platform packages, then the main package
        run: |
          npx napi pre-publish --npm-dir npm --tag-style npm
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
