[package]
name = "worker-shared-cache"
version = "0.1.0"
edition = "2024"
authors = ["Dave Tonge"]
description = "A byte-bounded cache per name, shared by every Node worker thread in the process"
license = "MIT"
repository = "https://github.com/davidgtonge/node-shared-cache"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
quick_cache = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = "0.1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
